<!doctype html>
<!-- PATH: public/offline.html -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3b5bdb" />
  <title>You are offline · StudyBuddy NG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #faf9f7; color: #1a1a2e;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    .box { max-width: 340px; }
    .icon { width: 64px; height: 64px; border-radius: 18px; background: #3b5bdb; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #6b7280; line-height: 1.5; }
    button { height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #3b5bdb; color: #fff; font-size: 16px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1117; color: #e8eaf0; }
      p { color: #a3a9b6; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fcc419"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>StudyHub needs internet to open your notes and quizzes. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    // As soon as the phone gets internet back, open the app again automatically
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
